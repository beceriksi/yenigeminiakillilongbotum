name: Crypto Pump Scanner

on:
  schedule:
    # Her 10 dakikada bir çalışacak şekilde ayarlandı
    - cron: '*/10 * * * *'
  workflow_dispatch: # İstediğinde manuel olarak başlatabilmen için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/status-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_dosya_adin.py # Buraya python dosyanın adını tam yaz
