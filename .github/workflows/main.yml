name: Long Pump Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir çalışır
  workflow_dispatch:        # İstediğinde elle çalıştırman için buton açar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Hafıza dosyasını kaydedebilmesi için izin
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save Memory
        run: |
          git config --global user.name 'PumpBot'
          git config --global user.email 'bot@github.com'
          git add pump_history.json
          git commit -m "Hafıza güncellendi" || echo "Değişiklik yok"
          git push
