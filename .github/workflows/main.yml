name: Crypto Pump Scanner

on:
  schedule:
    # Her 10 dakikada bir çalışır
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manuel başlatma butonu sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        # Buradaki hatayı düzelttik: setup-python olmalı
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # Kütüphaneleri önbelleğe alarak hızlandırır

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Dosya adının 'bot.py' olduğunu varsaydım, seninkisi farklıysa değiştir.
        run: python bot.py
